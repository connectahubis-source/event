// ============================================================================

async function fetchEvents() {
  try {
    const url = `${CONFIG.GAS_URL}?action=listEvents&_t=${Date.now()}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data && Array.isArray(data.result)) return data.result;
    if (Array.isArray(data)) return data;
    return [];
  } catch (err) {
    console.error('[Participants] fetchEvents error:', err);
    return [];
  }
}

// 日付を YYYY.MM.DD DAY 形式に
function formatEventDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  const dayNames = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${dayNames[d.getDay()]}`;
}

// 公開イベントのフィルタ
function filterPublicEvents(events) {
  return events.filter(e => e.status === '公開中' || e.status === '満員');
}

// ============================================================================

// ============================================================================
function useLang() {
  const [lang, setLangState] = useState(() => {
    const saved = localStorage.getItem('cca-lang');
    return saved && ['ja', 'easy', 'en'].includes(saved) ? saved : 'ja';
  });
  const setLang = (l) => {
    setLangState(l);
    localStorage.setItem('cca-lang', l);
  };
  return [lang, setLang];
}

// ============================================================================
// ROUTING (hash-based)
// ============================================================================
function useRoute() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  useEffect(() => {
    const handler = () => {
      setHash(window.location.hash || '#/');
      window.scrollTo(0, 0);
    };
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);
  return hash.replace(/^#/, '') || '/';
}

// ============================================================================
// UTM TRACKING (Phase 1: 取得 + localStorage 保存のみ。送信は次セッション)
// ============================================================================
function captureUTM() {
  const params = new URLSearchParams(window.location.search);
  const utm = {
    source: params.get('utm_source') || '',
    medium: params.get('utm_medium') || '',
    campaign: params.get('utm_campaign') || '',
    referrer: document.referrer || '',
    capturedAt: new Date().toISOString(),
  };
  if (utm.source || utm.medium || utm.campaign) {
    localStorage.setItem('cca-utm-first', JSON.stringify(utm));
    console.log('[UTM] captured:', utm);
  }
  // セッションIDを発行
  if (!localStorage.getItem('cca-session-id')) {
    localStorage.setItem('cca-session-id', 'S-' + Math.random().toString(36).slice(2, 14));
  }
  return utm;
}

// ============================================================================

// ============================================================================
function Reveal({ delay = 0, children, y = 24, style = {}, ...rest }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => e.isIntersecting && setShown(true)),
      { threshold: 0.15 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <div ref={ref} style={{
      opacity: shown ? 1 : 0,
      transform: shown ? 'none' : `translateY(${y}px)`,
      transition: `opacity .8s ${delay}ms cubic-bezier(.2,.7,.2,1), transform .8s ${delay}ms cubic-bezier(.2,.7,.2,1)`,
      ...style,
    }} {...rest}>{children}</div>
  );
}

function CountUp({ to, suffix = '', duration = 1400 }) {
  const [n, setN] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        if (entries[0].isIntersecting) {
          const start = performance.now();
          const step = (now) => {
            const t = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            setN(Math.round(to * eased));
            if (t < 1) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
          io.disconnect();
        }
      },
      { threshold: 0.5 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [to]);
  return <span ref={ref}>{n.toLocaleString()}{suffix}</span>;
}

// ============================================================================
// EVENT CARD
// ============================================================================
function EventCard({ ev, lang, t, big }) {
  const cap = ev.capacity || 0;
  const reg = ev.registered || 0;
  const spotsLeft = Math.max(0, cap - reg);
  const isFull = ev.status === '満員' || (cap > 0 && spotsLeft === 0);

  const date = formatEventDate(ev.date);

  return (
    <a href={`#/events/${ev.id}`} style={{
      display: 'block',
      background: '#fff',
      borderRadius: 18,
      overflow: 'hidden',
      border: '1px solid var(--line)',
      transition: 'transform .3s, box-shadow .3s',
    }} onMouseEnter={(e)=>{e.currentTarget.style.transform='translateY(-4px)';e.currentTarget.style.boxShadow='0 20px 50px -20px rgba(0,0,0,0.15)';}}
       onMouseLeave={(e)=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow='';}}>
      {/* Cover */}
      <div className={`photo ${ev.category === 'IFT' ? 'photo--navy' : 'photo--coral'}`} style={{
        height: big ? 320 : 240,
        position: 'relative',
      }}>
        {/* Category badge */}
        <div style={{
          position: 'absolute', top: 16, left: 16,
          background: 'rgba(255,255,255,0.95)',
          color: 'var(--ink)',
          fontFamily: 'var(--mono)',
          fontSize: 10,
          fontWeight: 600,
          letterSpacing: '0.1em',
          padding: '5px 10px',
          borderRadius: 4,
        }}>{(ev.category || 'EVENT').toUpperCase()}</div>

        {/* Status badge */}
        {isFull && (
          <div style={{
            position: 'absolute', top: 16, right: 16,
            background: 'var(--coral)',
            color: '#fff',
            fontFamily: 'var(--mono)',
            fontSize: 10,
            fontWeight: 700,
            letterSpacing: '0.1em',
            padding: '5px 10px',
            borderRadius: 4,
          }}>{t.card.full.toUpperCase()}</div>
        )}
      </div>

      {/* Body */}
      <div style={{ padding: big ? '28px 28px 24px' : '20px 22px 22px' }}>
        <div style={{
          fontFamily: 'var(--mono)',
          fontSize: 11,
          color: 'var(--ink-mute)',
          letterSpacing: '0.08em',
          marginBottom: 12,
        }}>{date}</div>
        <h3 style={{
          fontFamily: 'var(--jp)',
          fontSize: big ? 24 : 18,
          fontWeight: 700,
          margin: '0 0 12px',
          lineHeight: 1.4,
          color: 'var(--ink)',
        }}>{ev.title}</h3>
        <div style={{
          fontSize: 13,
          color: 'var(--ink-mute)',
          marginBottom: 16,
          display: 'flex', flexDirection: 'column', gap: 4,
        }}>
          <span>📍 {ev.venue || '会場未定'}</span>
          {ev.time && <span>🕐 {ev.time}</span>}
        </div>
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          paddingTop: 14,
          borderTop: '1px solid var(--line)',
        }}>
          <div style={{ fontSize: 13, color: 'var(--ink-mute)' }}>
            {isFull ? t.card.closed : (
              <React.Fragment>{t.card.spots}: <b style={{ color: 'var(--ink)' }}>{spotsLeft}</b>/{cap || '∞'}</React.Fragment>
            )}
          </div>
          <div style={{
            fontSize: 13, fontWeight: 600,
            color: isFull ? 'var(--ink-faint)' : 'var(--coral)',
          }}>{isFull ? '—' : `${t.card.register} →`}</div>
        </div>
      </div>
    </a>
  );
}

function PageEvents({ lang, t, events, loading }) {
  const [category, setCategory] = useState('all');

  const visibleEvents = filterPublicEvents(events);
  const categories = useMemo(() => {
    const set = new Set();
    visibleEvents.forEach(e => { if (e.category) set.add(e.category); });
    return Array.from(set).sort();
  }, [visibleEvents]);

  const filtered = category === 'all'
    ? visibleEvents
    : visibleEvents.filter(e => e.category === category);

  return (
    <div>
      {/* Page header */}
      <section style={{
        padding: '140px 24px 60px',
        background: 'var(--paper-2)',
        borderBottom: '1px solid var(--line)',
      }}>
        <div style={{ maxWidth: 1280, margin: '0 auto' }}>
          <div style={{
            fontFamily: 'var(--mono)', fontSize: 11,
            color: 'var(--coral)', letterSpacing: '0.22em',
            marginBottom: 16,
          }}>EVENTS</div>
          <h1 style={{
            fontFamily: 'var(--jp)',
            fontSize: 'clamp(36px, 6vw, 72px)',
            fontWeight: 900,
            margin: 0,
            letterSpacing: '-0.02em',
            lineHeight: 1.1,
          }}>{t.sections.allEvents}</h1>
        </div>
      </section>

      {/* Filter */}
      <section style={{ padding: '40px 24px 0', maxWidth: 1280, margin: '0 auto' }}>
        <div style={{
          display: 'flex',
          alignItems: 'center',
          gap: 12,
          flexWrap: 'wrap',
          paddingBottom: 16,
          borderBottom: '1px solid var(--line)',
        }}>
          <span style={{
            fontFamily: 'var(--mono)', fontSize: 11,
            color: 'var(--ink-mute)', letterSpacing: '0.1em',
            marginRight: 8,
          }}>{t.filter.category}:</span>
          <FilterPill label={t.filter.all} active={category === 'all'} onClick={() => setCategory('all')} />
          {categories.map(cat => (
            <FilterPill key={cat} label={cat} active={category === cat} onClick={() => setCategory(cat)} />
          ))}
          <div style={{ flex: 1 }} />
          <span style={{ fontSize: 13, color: 'var(--ink-mute)' }}>
            {filtered.length} {lang === 'en' ? 'events' : lang === 'easy' ? 'イベント' : '件'}
          </span>
        </div>
      </section>

      {/* Events grid */}
      <section style={{ padding: '40px 24px 120px', maxWidth: 1280, margin: '0 auto' }}>
        {loading ? (
          <div style={{ padding: 80, textAlign: 'center', color: 'var(--ink-mute)' }}>{t.loading}</div>
        ) : filtered.length === 0 ? (
          <div style={{ padding: 80, textAlign: 'center', color: 'var(--ink-mute)' }}>{t.noEvents}</div>
        ) : (
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))',
            gap: 24,
          }}>
            {filtered.map((ev, i) => (
              <Reveal key={ev.id} delay={(i % 6) * 50}>
                <EventCard ev={ev} lang={lang} t={t} />
              </Reveal>
            ))}
          </div>
        )}
      </section>
    </div>
  );
}

  const t = I18N[lang] || I18N.ja;

  // UTM 取得 (初回)
  useEffect(() => {
    captureUTM();
  }, []);

  // イベントデータ取得
  useEffect(() => {
    let cancelled = false;
    async function load() {
      setLoading(true);
      const data = await fetchEvents();
      if (!cancelled) {
        setEvents(data);
        setLoading(false);
      }
    }
    load();
    return () => { cancelled = true; };
  }, []);

  // ルーティング
  let Page;
  let pageTitle = '';
  const isHome = route === '/';
  const matchEvent = route.match(/^\/events\/(.+)/);

  if (isHome) {
    Page = <PageHome lang={lang} t={t} events={events} loading={loading} />;
  } else if (route === '/events') {
    Page = <PageEvents lang={lang} t={t} events={events} loading={loading} />;
  } else if (matchEvent) {
    pageTitle = lang === 'en' ? 'Event Detail' : 'イベント詳細';
    Page = <PageStub lang={lang} t={t} title={pageTitle} />;
  } else if (route === '/about') {
    pageTitle = t.nav.about;
    Page = <PageStub lang={lang} t={t} title={pageTitle} />;
  } else if (route === '/news') {
    pageTitle = t.nav.news;
    Page = <PageStub lang={lang} t={t} title={pageTitle} />;
  } else if (route === '/contact') {
    pageTitle = t.nav.contact;
    Page = <PageStub lang={lang} t={t} title={pageTitle} />;
  } else if (route === '/login') {
    pageTitle = t.nav.login;
    Page = <PageStub lang={lang} t={t} title={pageTitle} />;
  } else if (route === '/signup') {
    pageTitle = t.nav.signup;
    Page = <PageStub lang={lang} t={t} title={pageTitle} />;
  } else if (route === '/mypage') {
    pageTitle = lang === 'en' ? 'My Page' : 'マイページ';
    Page = <PageStub lang={lang} t={t} title={pageTitle} />;
  } else {
    pageTitle = '404';
    Page = <PageStub lang={lang} t={t} title="Not Found" />;
  }

  return (
    <React.Fragment>
      <Nav lang={lang} setLang={setLang} t={t} transparent={isHome} />
      <main>{Page}</main>
      <Footer lang={lang} t={t} />
    </React.Fragment>
  );
}

try {
  const rootEl = document.getElementById('root');
  // フォールバックをクリア
  rootEl.innerHTML = '';
  ReactDOM.createRoot(rootEl).render(<App />);
} catch (err) {
  console.error('[App Boot Error]', err);
  const fallback = document.getElementById('fallback');
  if (fallback) {
    fallback.innerHTML = '<h1 style="color:#d44;">起動エラー</h1>'
      + '<p style="color:#666;font-family:monospace;font-size:12px;">' + (err.message || err) + '</p>';
  }
}
</script>

</body>
</html>
